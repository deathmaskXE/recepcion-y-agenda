<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda XE Taller</title><link rel="stylesheet" href="style.css?v=20260727-8"></head><body><div class="grid"></div><header><div class="kicker">XE SERVICIO ELECTRÓNICO</div><h1>AGENDA <span>DE CITAS</span></h1><p>Administración privada de citas</p></header><main class="admin">
<section id="login" class="panel"><h2>ACCESO PRIVADO</h2><input id="email" type="email" placeholder="Correo administrador"><input id="pass" type="password" placeholder="Contraseña"><button id="loginBtn">ENTRAR</button><small id="loginMsg"></small></section>
<div id="dashboard" class="hidden"><section class="privacy-toolbar" aria-label="Controles de privacidad"><span>MODO VIDEO</span><button id="toggleTelefonos" type="button" aria-pressed="false">MOSTRAR TELÉFONOS</button></section><section class="panel"><div class="head"><h2>NUEVA CITA</h2><div class="nav-actions"><a class="button-link" href="admin.html">RECEPCIÓN</a><a class="button-link" href="reservar.html" target="_blank">PANEL PÚBLICO</a><button id="logout">SALIR</button></div></div><div class="form"><input id="cliente" placeholder="Nombre del cliente"><input id="telefono" placeholder="WhatsApp"><input id="equipo" list="equipoOptions" placeholder="Equipo que llevará"><input id="modelo" list="modeloOptions" placeholder="Modelo / versión"><datalist id="equipoOptions"><option value="Xbox One"><option value="Xbox One S"><option value="Xbox Series S"><option value="Xbox Series X"><option value="PlayStation 4"><option value="PlayStation 4 Pro"><option value="PlayStation 5"><option value="Nintendo Switch"><option value="Control"></datalist><datalist id="modeloOptions"><option value="PS4"><option value="PS4 Pro"><option value="PS5"><option value="Xbox One"><option value="Xbox One S"><option value="Xbox Series S"><option value="Xbox Series X"><option value="Nintendo Switch"></datalist><div id="appointmentEquipmentPreview" class="equipment-preview-field"></div><textarea id="falla" placeholder="Falla reportada"></textarea><div class="date-time-grid"><label>FECHA<input id="fecha" type="date"></label><label>HORA<input id="hora" type="time"></label></div></div><button id="crearCita">CREAR CITA Y FOLIO</button><strong id="createdCita"></strong></section>
<section class="panel"><div class="head"><div><h2>SOLICITUDES POR CONFIRMAR</h2><p>Aprueba únicamente los horarios en los que sí podrás recibir al cliente.</p></div></div><div id="solicitudesList" class="list"></div></section>
<section class="panel"><div class="head"><h2>CITAS REGISTRADAS</h2><input id="filterCitas" placeholder="Buscar folio, cliente o equipo"></div><div id="calendarSummary" class="calendar-summary"></div><div id="citasList" class="list"></div></section></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module" src="agenda.js?v=20260727-7"></script></body></html>
